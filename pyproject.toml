[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exoplanet-uq"
version = "0.1.0"
description = "Bayesian uncertainty quantification for exoplanet transit detection (SLIIT J26-IT-449)"
readme = "README.md"
# Streamlit (the dashboard) needs Python 3.11 or newer.
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "requests>=2.31",
    "astropy>=6.0",
    "lightkurve>=2.4",
    # The CPU-only build is enough for this project; see README "Set up".
    "torch>=2.14",
    # The research dashboard in app/ (Step 9).
    "streamlit>=1.65",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Lesson notes contain code sketches laid out for teaching, not project code.
extend-exclude = ["Docs"]

[tool.ruff.lint]
# E/F: basic errors, I: import order, B: common bugs, UP: modern Python style
select = ["E", "F", "I", "B", "UP"]
